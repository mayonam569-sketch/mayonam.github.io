<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mayona 💙</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #bde9ff, #4d91e8, #8fc9ff);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .star {
      position: absolute;
      color: rgba(255,255,255,0.7);
      font-size: 25px;
      animation: float 5s infinite ease-in-out;
    }

    .star:nth-child(1) { top: 8%; left: 10%; }
    .star:nth-child(2) { top: 20%; right: 12%; font-size: 40px; }
    .star:nth-child(3) { top: 55%; left: 5%; }
    .star:nth-child(4) { bottom: 12%; right: 10%; font-size: 35px; }
    .star:nth-child(5) { bottom: 25%; left: 18%; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(10deg); }
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 2px solid rgba(255,255,255,0.45);
      border-radius: 30px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(20,80,150,0.35);
      position: relative;
      z-index: 2;
    }

    .avatar {
      width: 145px;
      height: 145px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid white;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      margin-bottom: 15px;
      background: #d9efff;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 7px;
    }

    .description {
      font-size: 16px;
      margin-bottom: 25px;
      opacity: 0.95;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: white;
      font-weight: bold;
      font-size: 18px;
      margin: 13px 0;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.22);
      border: 1px solid rgba(255,255,255,0.45);
      transition: 0.25s;
      box-shadow: 0 6px 15px rgba(30,90,160,0.18);
    }

    .link:hover {
      transform: scale(1.04);
      background: rgba(255,255,255,0.35);
    }

    .emoji {
      margin-right: 12px;
      font-size: 25px;
    }

    footer {
      margin-top: 22px;
      font-size: 13px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="stars">
    <div class="star">☆</div>
    <div class="star">★</div>
    <div class="star">☆</div>
    <div class="star">★</div>
    <div class="star">☆</div>
  </div>

  <main class="card">

    <!-- Avatar Roblox -->
    <img
      class="avatar"
      src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-9134113351-Png/420/420/AvatarHeadshot/Png/noFilter"
      alt="Avatar Roblox de Mayona"
    >

    <h1>Mayona 💙</h1>

    <p class="description">
      ✨ Retrouve-moi sur tous mes réseaux ✨
    </p>

    <a class="link"
       href="https://www.roblox.com/fr/users/9134113351/profile"
       target="_blank">
      <span class="emoji">🎮</span>
      Roblox
    </a>

    <a class="link"
       href="https://www.tiktok.com/@mayona902"
       target="_blank">
      <span class="emoji">🎵</span>
      TikTok
    </a>

    <a class="link"
       href="https://www.instagram.com/audin.teddy"
       target="_blank">
      <span class="emoji">📸</span>
      Instagram
    </a>

    <a class="link"
       href="https://discord.gg/db8xhfM2t"
       target="_blank">
      <span class="emoji">💬</span>
      Discord
    </a>

    <a class="link"
       href="https://www.youtube.com/@Mayona-c5p"
       target="_blank">
      <span class="emoji">▶️</span>
      YouTube
    </a>

    <footer>
      💙 Merci d'être passé(e) !
    </footer>

  </main>

</body>
  </html>
